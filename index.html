<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Commerce AI Query Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 650px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .examples {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .examples p {
            margin: 6px 0;
            color: #555;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;

            border: none;
            border-radius: 7px;

            background: #0078d4;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #005ea6;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            display: none;

            margin-top: 25px;
            padding: 18px;

            background: #eef6ff;
            border-left: 4px solid #0078d4;
            border-radius: 5px;

            white-space: pre-wrap;
            line-height: 1.5;
        }

        #error {
            display: none;

            margin-top: 25px;
            padding: 18px;

            background: #fff0f0;
            border-left: 4px solid #d13438;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Order Assistant</h1>

    <div class="subtitle">
        Ask questions about your e-commerce data
    </div>

    <div class="examples">
        <strong>Example questions</strong>

        <p>How many orders are there?</p>
        <p>Show latest 5 orders</p>
        <p>Show all pending orders</p>
        <p>Which products are low in stock?</p>
    </div>

    <input
        type="text"
        id="question"
        placeholder="Ask a question..."
        autocomplete="off"
    >

    <button id="askButton" onclick="askQuestion()">
        Ask AI
    </button>

    <div id="result"></div>

    <div id="error"></div>

</div>


<script>

const API_URL =
    "https://ecommerceop.azurewebsites.net/api/query";


async function askQuestion() {

    const input = document.getElementById("question");
    const result = document.getElementById("result");
    const error = document.getElementById("error");
    const button = document.getElementById("askButton");

    const question = input.value.trim();


    if (!question) {

        error.style.display = "block";
        error.innerText = "Please enter a question.";

        result.style.display = "none";

        return;
    }


    result.style.display = "block";
    result.innerText = "Processing your question...";

    error.style.display = "none";

    button.disabled = true;
    button.innerText = "Processing...";


    try {

        const response = await fetch(
            API_URL + "?query=" + encodeURIComponent(question)
        );


        const text = await response.text();


        if (!response.ok) {

            throw new Error(text);

        }


        result.innerText = text;


    } catch (err) {

        result.style.display = "none";

        error.style.display = "block";

        error.innerText =
            "Request failed: " + err.message;

    } finally {

        button.disabled = false;
        button.innerText = "Ask AI";

    }

}


document
    .getElementById("question")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            askQuestion();
        }

    });

</script>

</body>
</html>
